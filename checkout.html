<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Checkout - Online Book Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        📚 Online Book Store
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="php/book.php">Books</a>
        <a href="cart.html">Cart 🛒</a>
    </nav>

</header>


<section class="checkout-page">

    <h1>Checkout</h1>

    <p>Enter your details to complete your order.</p>


    <div class="checkout-box">

        <h2>Customer Information</h2>

        <form onsubmit="placeOrder(event)">

            <label>Full Name</label>
            <input type="text" id="name" required>


            <label>Email</label>
            <input type="email" id="email" required>


            <label>Phone Number</label>
            <input type="text" id="phone" required>


            <label>Address</label>
            <textarea id="address" required></textarea>


            <label>City</label>
            <input type="text" id="city" required>


            <label>Pincode</label>
            <input type="text" id="pincode" required>


            <h2>Order Summary</h2>

            <div id="order-details"></div>

            <button type="submit" class="checkout-btn">
                Place Order
            </button>

        </form>

    </div>

</section>


<footer>

    <h3>📚 Online Book Store</h3>

    <p>
        Your place to discover and purchase books online.
    </p>

    <p>
        © 2026 Online Book Store
    </p>

</footer>


<script>

    function loadCheckout() {

        let data = localStorage.getItem("cartBook");

        if (!data) {

            document.getElementById("order-details").innerHTML =
                "<p>Your cart is empty.</p>";

            return;
        }

        let book = JSON.parse(data);

        let total = Number(book.price) * Number(book.quantity);

        document.getElementById("order-details").innerHTML =

            "<p><strong>" + book.name + "</strong></p>" +

            "<p>Author: " + book.author + "</p>" +

            "<p>Price: ₹" + book.price + "</p>" +

            "<p>Quantity: " + book.quantity + "</p>" +

            "<p>Delivery: Free</p>" +

            "<hr>" +

            "<h3>Total: ₹" + total + "</h3>";
    }


    function placeOrder(event) {

        event.preventDefault();

        alert("Order placed successfully!");

        localStorage.removeItem("cartBook");

        window.location.href = "index.html";
    }


    window.onload = loadCheckout;

</script>

</body>

</html>
