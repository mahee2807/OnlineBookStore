<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - Online Book Store</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        📚 Online Book Store
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="php/book.php">Books</a>

        <a href="cart.html">Cart 🛒</a>

    </nav>

</header>


<section class="cart-page">

    <h1>Shopping Cart</h1>

    <p class="cart-intro">
        Review the books you have selected.
    </p>


    <div class="cart-container">

        <div class="cart-item">

            <div
                    class="cart-book-image"
                    id="cart-book-image">
                📖
            </div>


            <div class="cart-book-info">

                <h3 id="cart-book-name">
                    Book
                </h3>

                <p id="cart-book-author">
                    Author
                </p>

                <p
                        class="cart-price"
                        id="cart-book-price">
                    ₹0
                </p>

            </div>


            <div class="quantity">

                <label>
                    Quantity
                </label>

                <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1">

            </div>


            <button
                    class="remove-btn"
                    onclick="removeFromCart()">

                Remove

            </button>

        </div>

    </div>


    <div class="cart-summary">

        <h2>Order Summary</h2>

        <p>
            Subtotal:
            <strong id="cart-total">₹0</strong>
        </p>

        <p>
            Delivery:
            <strong>Free</strong>
        </p>

        <hr>

        <h3>
            Total:
            <span id="final-total">₹0</span>
        </h3>

        <a
                href="checkout.html"
                class="checkout-btn">

            Proceed to Checkout

        </a>

    </div>

</section>


<footer>

    <h3>
        📚 Online Book Store
    </h3>

    <p>
        Your place to discover and purchase books online.
    </p>

    <p>
        © 2026 Online Book Store
    </p>

</footer>


<script>

    function loadCart() {

        let data = localStorage.getItem("cartBook");

        console.log("Cart data:", data);

        if (data === null) {

            console.log("No cart data found.");

            return;

        }


        let book = JSON.parse(data);

        console.log("Book:", book);


        document.getElementById("cart-book-name").innerText =
            book.name;

        document.getElementById("cart-book-author").innerText =
            book.author;

        document.getElementById("cart-book-price").innerText =
            "₹" + Number(book.price);

        document.getElementById("cart-book-image").innerText =
            book.image;


        document.getElementById("quantity").value =
            book.quantity;


        updateTotal();

    }


    function updateTotal() {

        let data = localStorage.getItem("cartBook");

        if (data === null) {
            return;
        }


        let book = JSON.parse(data);

        let quantity =
            Number(document.getElementById("quantity").value);


        if (quantity < 1) {

            quantity = 1;

            document.getElementById("quantity").value = 1;

        }


        let total =
            Number(book.price) * quantity;


        document.getElementById("cart-total").innerText =
            "₹" + total;

        document.getElementById("final-total").innerText =
            "₹" + total;


        book.quantity = quantity;

        localStorage.setItem(
            "cartBook",
            JSON.stringify(book)
        );

    }


    function removeFromCart() {

        localStorage.removeItem("cartBook");

        window.location.reload();

    }


    document
        .getElementById("quantity")
        .addEventListener("change", updateTotal);


    window.addEventListener("load", loadCart);

</script>


</body>

</html>
