<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/cart.js"></script>

</head>

<body>

<header>

    <div class="logo">
        📚 Online Book Store
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="php/book.php">Books</a>
        <a href="cart.html">Cart 🛒</a>
    </nav>

</header>


<section class="cart-page">

    <h1>Shopping Cart</h1>

    <p>
        Review the books you have selected.
    </p>


    <div class="cart-container">

        <div class="cart-item">

            <div
                    class="cart-book-image"
                    id="cart-book-image">

                📖

            </div>


            <div class="cart-book-info">

                <h3 id="cart-book-name">
                    Book
                </h3>

                <p id="cart-book-author">
                    Author
                </p>

                <p
                        class="cart-price"
                        id="cart-book-price">

                    ₹0

                </p>

            </div>


            <div class="quantity">

                <label>
                    Quantity
                </label>

                <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                        onchange="updateTotal()">

            </div>


            <button
                    class="remove-btn"
                    onclick="removeFromCart()">

                Remove

            </button>

        </div>

    </div>


    <div class="cart-summary">

        <h2>
            Order Summary
        </h2>

        <p>
            Subtotal:
            <strong id="cart-total">
                ₹0
            </strong>
        </p>

        <p>
            Delivery:
            <strong>
                Free
            </strong>
        </p>

        <hr>

        <h3>
            Total:
            <span id="final-total">
                ₹0
            </span>
        </h3>

        <a
                href="php/checkout.php"
                class="checkout-btn">

            Proceed to Checkout

        </a>

    </div>

</section>


<footer>

    <h3>
        📚 Online Book Store
    </h3>

    <p>
        Your place to discover and purchase books online.
    </p>

    <p>
        © 2026 Online Book Store
    </p>

</footer>

</body>

</html>
